
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePay Training Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="images.png" alt="SafePay Logo">
    </div>

    <div class="tag">SafePay Training Demo</div>
  </header>

  <main class="container">

    <div class="notice">
      শিক্ষামূলক প্রশিক্ষণ। শুধু কাল্পনিক তথ্য ব্যবহার করুন।
      কোনো আসল PIN বা OTP দেবেন না।
    </div>

    <section class="card">

      <div class="progress-area">
        <span id="progress">STEP 1 / 4</span>

        <div class="progress-bg">
          <div id="progressBar"></div>
        </div>
      </div>

      <h2 id="title">Demo Account</h2>

      <div id="content"></div>

      <p id="message"></p>

      <div class="button-group">
        <button id="back" type="button">Back</button>
        <button id="next" type="button">Continue</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
